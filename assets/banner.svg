<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Styles for Dynamic / Animated Elements -->
  <style>
    .grid-line { stroke: #1f2937; stroke-width: 1; opacity: 0.4; }
    .float-pill { animation: float 6s infinite ease-in-out; }
    .wave-line { animation: dash 12s linear infinite; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Glow Background Orbs -->
  <circle cx="150" cy="100" r="180" fill="#3b82f6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="1050" cy="300" r="200" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="600" cy="200" r="220" fill="#ec4899" opacity="0.08" filter="url(#softGlow)" />

  <!-- Grid Pattern Background -->
  <g class="grid">
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />

    <line x1="200" y1="0" x2="200" y2="400" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="400" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="400" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="400" class="grid-line" />
  </g>

  <!-- Dynamic Animated Graph & Flow Waves (In Background/Sides) -->
  <g opacity="0.35">
    <path d="M 50 320 Q 200 220 350 280 T 650 180 T 950 250 T 1150 120" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4" class="wave-line" />
    <path d="M 50 350 Q 250 290 450 330 T 800 210 T 1150 180" fill="none" stroke="#8b5cf6" stroke-width="2" />
  </g>

  <!-- Decorative Pills / Badges (Positioned safely away from title) -->
  <g class="float-pill">
    <rect x="920" y="45" width="220" height="42" rx="21" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
    <circle cx="945" cy="66" r="6" fill="#10b981" />
    <text x="960" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">⚡ Real-time Ingestion</text>
  </g>

  <g class="float-pill" style="animation-delay: -3s;">
    <rect x="60" y="315" width="230" height="42" rx="21" fill="#1f2937" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8" />
    <circle cx="85" cy="336" r="6" fill="#3b82f6" />
    <text x="100" y="341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">🔍 Sub-second Search</text>
  </g>

  <g class="float-pill" style="animation-delay: -1.5s;">
    <rect x="910" y="315" width="230" height="42" rx="21" fill="#1f2937" stroke="#ec4899" stroke-width="1.5" opacity="0.8" />
    <circle cx="935" cy="336" r="6" fill="#ec4899" />
    <text x="950" y="341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">📊 Zero Infra Overhead</text>
  </g>

  <!-- Foreground Title Card Overlay -->
  <rect x="180" y="100" width="840" height="190" rx="16" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)" />

  <!-- Top Accent Bar on Main Card -->
  <rect x="180" y="100" width="840" height="4" rx="2" fill="url(#primaryGrad)" />

  <!-- FOREGROUND TEXT -->
  <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#3b82f6">CURATED ECOSYSTEM &amp; BENCHMARKS</text>
  <text x="600" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Awesome Serverless Search &amp; Log Analytics</text>
  <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#9ca3af">Top SaaS Platforms &amp; High-Performance Open-Source Observability Engines</text>
  <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#6b7280">Elasticsearch Alternatives • OpenTelemetry • Object Storage Native • Sub-second SQL/PromQL</text>
</svg>
